org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
# 工程本身不使用任何 AndroidX 组件：界面全部是系统原生控件，颜色/样式也都在本工程里。
# 打开这个开关只为满足一个传递依赖 —— Shizuku 的 API 包在字节码里引用了
# androidx.annotation.RestrictTo（标注「库内部使用」），关掉的话 AGP 会直接拒绝构建。
# androidx.annotation 只含注解，不进 UI、体积极小，不影响「全系统原生控件」这一点。
android.useAndroidX=true
# 工程路径含中文（D:\工作区间\...），AGP 默认会拦截；构建链路已全程指定 UTF-8
android.overridePathCheck=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
